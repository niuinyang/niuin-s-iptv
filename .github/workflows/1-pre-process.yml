name: 1-预处理-下载-转txt-合并-分割-生成

on:
  workflow_dispatch:
  schedule:
    - cron: '05 16 * * *'   # UTC 16:05 = 北京时间 00:05
    - cron: '05 1 * * *'   # UTC 01:05 = 北京时间 09:05
    - cron: '40 6 * * *'    # UTC 06:40 = 北京时间 14:40
    - cron: '40 12 * * *'   # UTC 08:40 = 北京时间 20:40

permissions:
  contents: write

jobs:
  # =====================================================
  # 0️⃣ 清理旧结果目录
  # =====================================================
  job0_clean_old_results:
    name: 0_清理旧结果目录
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 强制同步代码和文件（reset to origin/main）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 清理旧结果目录并提交推送
        env:
          PUSH_TOKEN1: ${{ secrets.PUSH_TOKEN1 }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # 清理目录（删除所有文件，保留目录结构）
          rm -rf output/hash/chunk/*
          rm -rf output/middle/fast/*
          rm -rf output/middle/deep/*
          rm -rf output/middle/chunk/*
          mkdir -p output/hash/chunk
          mkdir -p output/middle/fast
          mkdir -p output/middle/deep
          mkdir -p output/middle/chunk

          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 添加变更
          git add output/hash/chunk output/middle/fast output/middle/deep output/middle/chunk

          # 判断是否有变更
          if git diff --cached --quiet; then
            echo "✅ 没有清理后的变更，跳过提交"
            exit 0
          fi

          # 提交并推送
          git commit -m "清理旧结果目录，开始新一轮扫描 [ci skip]"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN1}@github.com/${REPO}.git
          git push origin HEAD:main --force-with-lease

  # =====================================================
  # 1️⃣ 下载 M3U
  # =====================================================
  job1_download_all_m3u:
    name: 1_下载源文件
    needs: job0_clean_old_results
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 强制同步代码和文件（reset to origin/main）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: |
          mkdir -p input/source
          mkdir -p input/download/my
          mkdir -p input/download/net
          mkdir -p scripts
          
      - run: python scripts/1_download_m3u.py
      
      - run: chmod -R u+rw input/download

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input/download
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi
          git commit -m "Update M3U sources [ci skip]"
          # >>> MODIFIED: 不再 pull/rebase，直接安全覆盖推送
          git push origin HEAD:main --force-with-lease
          # <<< MODIFIED

      - name: 等待 10 秒，确保推送同步
        run: sleep 10

  # =====================================================
  # 2️⃣ M3U → TXT
  # =====================================================
  job2_m3u_to_txt:
    name: 2_M3U转TXT
    needs: job1_download_all_m3u
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 强制同步代码和文件（reset to origin/main）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: |
          mkdir -p input/download/net/original
          mkdir -p input/download/net/txt

      - run: python scripts/2_m3u_to_txt.py

      - run: chmod -R u+rw input/download/net/txt

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input/download/net/txt
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi
          git commit -m "更新频道文件解析输出 [ci skip]"
          # >>> MODIFIED
          git push origin HEAD:main --force-with-lease
          # <<< MODIFIED

      - name: 等待 10 秒，确保推送同步
        run: sleep 10

  # =====================================================
  # 3️⃣ 合并源
  # =====================================================
  job3_merge_sources:
    name: 3_合并源
    needs: job2_m3u_to_txt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 强制同步代码和文件（reset to origin/main）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: |
          python -m pip install --upgrade pip
          pip install pandas chardet

      - run: python scripts/3_merge_local_sources.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/middle/merge/networksource_total.m3u
          git add output/middle/merge/networksource_total.csv
          git add output/log/merge/networksource_skipped.log
          git add output/middle/merge/mysource_total.m3u
          git add output/middle/merge/mysource_total.csv
          git add output/log/merge/mysource_skipped.log

          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi
          git commit -m "更新频道文件解析输出 [ci skip]"
          # >>> MODIFIED
          git push origin HEAD:main --force-with-lease
          # <<< MODIFIED

      - name: 等待 10 秒，确保推送同步
        run: sleep 10

  # =====================================================
  # 4️⃣ 分割 merge_total
  # =====================================================
  job4_split_merge:
    name: 4_分割文件
    needs: job3_merge_sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 强制同步代码和文件（reset to origin/main）
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install chardet

      - run: python scripts/4_split_merge.py

      # >>> MODIFIED: 不再上传 artifact，改为 git 提交 chunk 目录内容
      - name: Commit and push chunk csv files (替代上传 artifact)
        env:
          PUSH_TOKEN1: ${{ secrets.PUSH_TOKEN1 }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN1}@github.com/${REPO}.git

          git add output/middle/chunk/*.csv
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi
          git commit -m "Add chunk csv files [ci skip]"
          git push origin HEAD:main --force-with-lease
      # <<< MODIFIED

      - name: 等待 10 秒，确保推送同步
        run: sleep 10

  # =====================================================
  # 5️⃣ 生成 chunk workflows
  # =====================================================
  job5_generate_chunk_workflows:
    name: 5_生成Chunk Workflows
    needs: job4_split_merge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # >>> MODIFIED: 不再下载 artifact，改为从 git 拉取 chunk 目录内容
      - name: Pull chunk csv files from repo (替代下载 artifact)
        env:
          PUSH_TOKEN1: ${{ secrets.PUSH_TOKEN1 }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN1}@github.com/${REPO}.git
          git fetch origin main
          git reset --hard origin/main

          ls -lh output/middle/chunk  # <<< MODIFIED: 调试确认 chunk 文件已拉取
      # <<< MODIFIED

      - env:
          PUSH_TOKEN1: ${{ secrets.PUSH_TOKEN1 }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN1}@github.com/${REPO}.git

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install chardet pillow tqdm requests

      - run: |
          python scripts/5_generate_chunk_workflows.py
          git add .github/workflows output/middle
          if ! git diff --cached --quiet; then
            git commit -m "ci: auto-generate deep validation workflows"
            # >>> MODIFIED
            git push origin HEAD:main --force-with-lease
            # <<< MODIFIED
          else
            echo "无更改，跳过提交和推送"
          fi

      - name: 等待 10 秒，确保推送同步
        run: sleep 10
