name: 抓取直播帧并提交

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab_and_commit_frames:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v3

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 抓取2、5、20秒帧图片
        run: |
          mkdir -p output/linshi
          ffmpeg -ss 2 -i "http://z.b.bkpcp.top/m.php?id=hubws" -frames:v 1 -q:v 2 -y output/linshi/frame_2s.png
          ffmpeg -ss 5 -i "http://z.b.bkpcp.top/m.php?id=hubws" -frames:v 1 -q:v 2 -y output/linshi/frame_5s.png
          ffmpeg -ss 20 -i "http://z.b.bkpcp.top/m.php?id=hubws" -frames:v 1 -q:v 2 -y output/linshi/frame_20s.png

      - name: 提交并推送图片到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/linshi/frame_*.png
          git commit -m "自动抓帧图片更新 $(date +'%Y-%m-%d %H:%M:%S')" || echo "无变更，跳过提交"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN1 }}