name: 2-检查scan执行完毕合并

# >>> MODIFIED: 防止 merge / delete 流程并行 push
concurrency:
  group: iptv-merge-and-clean
  cancel-in-progress: false
# <<< MODIFIED

on:
  workflow_run:
    workflows:
      - "1-预处理-下载-转txt-合并-分割-生成"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wait-for-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # >>> MODIFIED: 确保拉取完整历史

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan watcher (async & realtime output)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/6.4_check-scan-finished-async.py

      - name: Wait 10 seconds
        run: sleep 10

  merge-results:
    needs: wait-for-scan
    runs-on: ubuntu-latest
    env:
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # >>> MODIFIED: 拉取完整历史，便于推送

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      # >>> MODIFIED: 移除所有 artifact 下载步骤，改为直接从仓库目录使用文件
      #- name: Download ALL scan-output artifacts (跨 workflow)
      #  uses: dawidd6/action-download-artifact@v4
      #  with:
      #    workflow: 'Scan_chunk*'
      #    name: 'scan-output'
      #    path: artifacts
      #    workflow_conclusion: success

      #- name: Download initial hash_total.json artifact (跨 workflow)
      #  uses: dawidd6/action-download-artifact@v4
      #  with:
      #    workflow: 'Download hash_total.json from Google Drive and upload'
      #    name: 'hash-db'
      #    path: output/hash
      #    workflow_conclusion: success
      # <<< MODIFIED END

      - name: Inspect repo files instead of artifacts  # >>> MODIFIED 新增
        run: |
          echo "=== output/middle/deep/ok ==="
          ls -lh output/middle/deep/ok || true
          echo "=== output/middle/deep/not ==="
          ls -lh output/middle/deep/not || true
          echo "=== output/hash/chunk ==="
          ls -lh output/hash/chunk || true
          echo "=== output/hash ==="
          ls -lh output/hash || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run merge hash script
        run: python scripts/7.1_merge_hash.py

      # >>> MODIFIED: 直接提交 hash_total.json 到仓库（如果需要）
      - name: Commit and push merged hash_total.json (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/hash/hash_total.json || true

          if git diff --cached --quiet; then
            echo "No changes in hash_total.json"
          else
            git commit -m "Update merged hash_total.json [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.PUSH_TOKEN1 }}@github.com/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}.git
            git push origin HEAD:main --force-with-lease
          fi
      # <<< MODIFIED END

      - name: Run merge deep scan csv script
        run: python scripts/7.2_merge_deep_scan.py

      # >>> MODIFIED: 只提交最终业务结果到 git
      - name: Commit and push merged deep scan CSV results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/middle/deep/deep_total_ok.csv output/middle/deep/deep_total_not.csv

          if git diff --cached --quiet; then
            echo "No merge result changes."
            exit 0
          fi

          git commit -m "Merge deep scan results [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.PUSH_TOKEN1 }}@github.com/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}.git
          git push origin HEAD:main --force-with-lease
      # <<< MODIFIED

      - name: Wait 10 seconds
        run: sleep 10

  delete_workflows:
    needs: merge-results
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # >>> MODIFIED 保持统一拉取深度

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Delete scan_chunk workflow files only
        run: |
          FILES_SCAN_CHUNK=$(find .github/workflows -type f -name "scan_chunk*.yml" || true)
          if [ -z "$FILES_SCAN_CHUNK" ]; then
            echo "No matching scan_chunk workflow files found."
            exit 0
          fi

          echo "Deleting files:"
          echo "$FILES_SCAN_CHUNK"

          git rm $FILES_SCAN_CHUNK || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "Delete scan_chunk workflow files" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.PUSH_TOKEN1 }}@github.com/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}.git
          git push origin HEAD:main --force-with-lease

      - name: Wait 10 seconds
        run: sleep 10