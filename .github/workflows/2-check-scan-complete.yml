name: 2-检查scan执行完毕合并

on:
  workflow_run:
    workflows:
      - "1-预处理-下载-转txt-合并-分割-生成"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wait-for-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan watcher (async & realtime output)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/6.4_check-scan-finished-async.py

      - name: Wait 10 seconds
        run: sleep 10

  merge-results:
    needs: wait-for-scan
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run merge hash script
        run: python scripts/7.1_merge_hash.py

      # ✅ 修改为严格 14 天时间窗口，删除并 push
      - name: Cleanup old hash-merge files (strict 14-day window)
        run: |
          set -e

          folder="output/hash/merge"
          keep_days=14

          if [ ! -d "$folder" ]; then
            echo "Folder not found: $folder"
            exit 0
          fi

          # 计算 14 天前的日期（UTC）
          cutoff=$(date -u -d "$keep_days days ago" +"%y%m%d")
          echo "Cutoff date (keep >=): $cutoff"

          deleted=0

          for file in "$folder"/*-hash-merge.json; do
            [ -e "$file" ] || continue

            name=$(basename "$file")
            file_date="${name:0:6}"

            if [[ "$file_date" < "$cutoff" ]]; then
              echo "DELETE $file"
              git rm "$file"
              deleted=$((deleted + 1))
            else
              echo "KEEP   $file"
            fi
          done

          echo "Deleted files count: $deleted"

          # 只在有删除文件时提交
          if [ "$deleted" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Cleanup old hash-merge files (strict 14-day window)"
            git push origin main
          fi

      - name: Run merge deep scan csv script
        run: python scripts/7.2_merge_deep_scan.py

      - name: Commit and push merged results safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            output/hash/merge/*-hash-merge.json \
            output/middle/deep/deep_total_ok.csv \
            output/middle/deep/deep_total_not.csv || true

          if git diff --cached --quiet; then
            echo "No merged result changes."
            exit 0
          fi

          git commit -m "Merge scan results $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main

      - name: Wait 10 seconds
        run: sleep 10

  delete_workflows:
    needs: merge-results
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Delete scan_chunk workflow files only
        run: |
          FILES_SCAN_CHUNK=$(find .github/workflows -type f -name "scan_chunk*.yml" || true)
          if [ -z "$FILES_SCAN_CHUNK" ]; then
            echo "No matching scan_chunk workflow files found."
            exit 0
          fi
          echo "Deleting files:"
          echo "$FILES_SCAN_CHUNK"

          git rm $FILES_SCAN_CHUNK || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Delete scan_chunk workflow files" || echo "No changes to commit"

          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git
          git pull --rebase origin main
          git push origin main

      - name: Wait 10 seconds
        run: sleep 10
