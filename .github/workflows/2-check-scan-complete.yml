name: 2-检查scan执行完毕合并

on:
  workflow_run:
    workflows:
      - "1-预处理-下载-转txt-合并-分割-生成"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wait-for-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/6.4_check-scan-finished-async.py

  merge-results:
    needs: wait-for-scan
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
      REPO_OWNER: niuinyang
      REPO_NAME: niuin-s-iptv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run merge hash script
        run: python scripts/7.1_merge_hash.py

      # ==================================================
      # <<< FIX: 保留最近14天 × 每天最多4个 hash-merge
      # ==================================================
      - name: Cleanup hash-merge files (14 days × 4 per day)
        run: |
          set -e

          folder="output/hash/merge"
          keep_days=14
          keep_per_day=4

          if [ ! -d "$folder" ]; then
            echo "Folder not found: $folder"
            exit 0
          fi

          # 按文件名时间排序（旧 → 新）
          mapfile -t files < <(
            ls -1 "$folder"/*-hash-merge.json 2>/dev/null | sort
          )

          declare -A day_count
          declare -A day_seen
          kept=()
          deleted=()

          # 倒序遍历（新 → 旧）
          for ((i=${#files[@]}-1; i>=0; i--)); do
            file="${files[$i]}"
            name=$(basename "$file")

            # 文件名格式：YYMMDDHHMM-hash-merge.json
            day="${name:0:6}"

            # 记录出现过的天
            if [ -z "${day_seen[$day]+x}" ]; then
              day_seen[$day]=1
            fi

            # 超过 14 天的直接删除
            if [ "${#day_seen[@]}" -gt "$keep_days" ]; then
              deleted+=("$file")
              continue
            fi

            # 同一天超过 4 个的删除
            count=${day_count[$day]:-0}
            if [ "$count" -ge "$keep_per_day" ]; then
              deleted+=("$file")
              continue
            fi

            day_count[$day]=$((count + 1))
            kept+=("$file")
          done

          echo "Kept files:"
          for f in "${kept[@]}"; do
            echo "  KEEP $f"
          done

          echo "Deleted files:"
          for f in "${deleted[@]}"; do
            echo "  DELETE $f"
            rm -f "$f"
          done
      # ==================================================

      - name: Commit and push merged hash JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/hash/merge/*-hash-merge.json || true
          if git diff --cached --quiet; then
            echo "No hash merge changes."
            exit 0
          fi

          git commit -m "Update merged hash JSON [skip ci]"
          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git
          git push origin HEAD:main --force-with-lease
