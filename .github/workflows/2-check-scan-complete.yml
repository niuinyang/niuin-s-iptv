name: 3-静态假源检测与结果写回

on:
  workflow_run:
    workflows:
      - "2-检查scan执行完毕合并"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN1 }}
  REPO_OWNER: niuinyang
  REPO_NAME: niuin-s-iptv

jobs:
  fake_loop_scan:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN1 }}
          fetch-depth: 0   # ⭐ 必须，rebase 需要完整历史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy

      - name: Run fake loop scan
        run: |
          python3 scripts/8.2_loop_scan.py

      # =========================
      # 🔒 防冲突 Git 提交流程
      # =========================
      - name: Commit and push results safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/middle/fake_loop/fake_loop_scan.csv

          # 若无变化，不报错
          git commit -m "自动更新静态假源检测结果 $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          # ⭐ 核心：先 rebase 再 push
          git pull --rebase origin main
          git push origin main
