name: 8-假源与轮播判定

on:
  # 上游 workflow 结束后自动触发
  workflow_run:
    workflows:
      - "2-检查scan执行完毕合并"
    types:
      - completed

  # 手动触发（已验证不会 skipped）
  workflow_dispatch:

# 防止并发写 fake_hash.json / working_*.csv
concurrency:
  group: iptv-fake-loop-scan
  cancel-in-progress: false

jobs:
  fake_loop_scan:
    runs-on: ubuntu-latest

    # ⭐⭐⭐ 关键修复点：兼容 workflow_dispatch + workflow_run ⭐⭐⭐
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tqdm

      - name: Run fake & loop scan
        run: |
          python scripts/8_fake_loop_scan.py \
            --hash-dir output/hash/merge \
            --deep-csv output/middle/deep/deep_total_ok.csv \
            --fake-hash-json output/hash/fake_hash.json \
            --output-total output/working/working_total.csv \
            --output-fake output/working/working_fake.csv \
            --output-loop output/working/working_loop.csv \
            --output-ok output/working/working_ok.csv \
            --max-history 6 \
            --threads 8 \
            --log-level INFO

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add \
              output/working/*.csv \
              output/hash/fake_hash.json
            git commit -m "chore: update fake/loop scan results"
            git push
          else
            echo "No changes to commit"
          fi
