name: 8.1 Fake Scan

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - "2-检查scan执行完毕合并"
    types:
      - completed

  workflow_dispatch:

jobs:
  fake_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run 8.1_fake_scan.py
      run: python scripts/8.1_fake_scan.py

    - name: Configure git for commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add output/middle/fake-scan/fake-ok.csv output/middle/fake-scan/fake-not.csv
        git diff --cached --quiet || (git commit -m "自动更新 8.1_fake_scan 结果 CSV" && git push)
